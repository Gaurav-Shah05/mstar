model: "pi05"
max_seq_len: 2048

# FlashInfer FA2 rather than the FA3 kernel "auto" picks on SM90 (H100/H200):
# the captured action_gen step (10 Euler steps of ~15 action queries over the
# ~900-token prefix) 14.0 -> 10.1 ms on an H200, for +0.3 ms of prefill.
# Elsewhere "auto" already picks FA2.
resources:
  attn:
    flashinfer_backend: fa2

node_groups:
  - node_names:
      - vit_encoder
    ranks:
      - 0

  - node_names:
      - LLM
    ranks:
      - 0
